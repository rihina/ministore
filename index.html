<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Product Store</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <!--
    NOTICE: The HTML is intentionally almost empty.
    You are NOT allowed to hardcode product rows like <div>Apple</div>.
    Every product card and every cart row must be created by JavaScript.
  -->

    <h1>🛒 Mini Product Store</h1>

    <main>
        <!-- Your JS will fill this with product cards -->
        <section>
            <h2>Products</h2>
            <div id="product-list"></div>
        </section>

        <!-- Your JS will fill this with the items the user added -->
        <section>
            <h2>Cart</h2>
            <ul id="cart"></ul>
            <p id="total">Total: ₱0</p>
        </section>
    </main>

    <!-- While learning, use script.js. Swap to SOLUTION.js to see the finished demo. -->
    <script src="script.js"></script>
</body>

</html>
